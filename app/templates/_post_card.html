<article class="bg-white rounded-2xl shadow p-4">
  <div class="flex items-center gap-3 mb-2">
    <a href="/users/{{ post.author.username }}">
      {% if post.author.avatar %}
        <img src="{{ post.author.avatar }}" class="w-9 h-9 rounded-full object-cover" alt="">
      {% else %}
        <span class="w-9 h-9 rounded-full bg-amber-200 flex items-center justify-center">🐾</span>
      {% endif %}
    </a>
    <div>
      <a href="/users/{{ post.author.username }}" class="font-semibold hover:text-amber-600">{{ post.author.username }}</a>
      <div class="text-xs text-gray-400">{{ post.created_at | timeago }}</div>
    </div>
  </div>

  <a href="/posts/{{ post.id }}" class="block">
    <h2 class="text-lg font-semibold mb-1 hover:text-amber-600">{{ post.title }}</h2>
    <p class="text-gray-600 text-sm line-clamp-3 whitespace-pre-wrap">{{ post.content }}</p>
  </a>

  {% if post.image %}
    <a href="/posts/{{ post.id }}">
      <img src="{{ post.image }}" class="mt-3 rounded-xl max-h-72 w-full object-cover" alt="">
    </a>
  {% endif %}

  <div class="flex items-center gap-4 mt-3 text-sm text-gray-500">
    <button
      class="like-btn flex items-center gap-1 {% if current_user and post.id in liked_post_ids %}text-amber-600 liked{% endif %}"
      data-post-id="{{ post.id }}"
      type="button"
    >
      <span>❤️</span><span class="count">{{ post.likes | length }}</span>
    </button>
    <a href="/posts/{{ post.id }}" class="flex items-center gap-1">💬 {{ post.comments | length }}</a>
  </div>
</article>
