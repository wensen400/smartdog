{% extends "base.html" %}
{% block title %}发布帖子 · smartdog 智能狗{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">发布帖子</h1>
{% if errors %}
  <div class="bg-red-50 text-red-600 rounded-xl p-3 mb-4 text-sm">
    <ul class="list-disc list-inside">{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>
  </div>
{% endif %}
<form method="post" action="/posts" enctype="multipart/form-data" class="bg-white rounded-2xl shadow p-6 space-y-4">
  <div>
    <label class="block text-sm font-medium mb-1">标题</label>
    <input name="title" required value="{{ title or '' }}" class="w-full border rounded-xl px-3 py-2" placeholder="给你的帖子起个标题">
  </div>
  <div>
    <label class="block text-sm font-medium mb-1">正文</label>
    <textarea name="content" required rows="6" class="w-full border rounded-xl px-3 py-2" placeholder="分享你和宠物的故事...">{{ content or '' }}</textarea>
  </div>
  <div>
    <label class="block text-sm font-medium mb-1">图片（可选）</label>
    <input type="file" name="image" accept="image/*" class="block text-sm">
  </div>
  <button class="bg-amber-500 text-white px-6 py-2 rounded-full hover:bg-amber-600">发布</button>
</form>
{% endblock %}
